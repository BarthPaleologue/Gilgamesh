name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - name: Update Rust stable
      run: rustup update stable --no-self-update
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --locked --workspace --all-targets
    - name: Clippy WebAssembly
      run: cargo clippy --locked --workspace --all-targets --target wasm32-unknown-unknown
    - name: Build
      run: cargo build --locked --workspace --verbose
    - name: Run tests
      run: cargo test --locked --workspace --verbose
    - name: Build WebAssembly
      run: cargo build --locked --workspace --target wasm32-unknown-unknown --verbose
