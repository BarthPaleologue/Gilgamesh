[package]
name = "gilgamesh"
version = "2.0.0-alpha"
edition = "2024"
rust-version = "1.99"
description = "A small 3D rendering engine built upon WGPU with the primary goal of visualizing procedural terrains."
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["examples/game_of_life", "examples/headless", "examples/splitscreen", "examples/starsystem", "examples/terrain"]

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
unwrap_used = "warn"

[lints]
workspace = true

[workspace.dependencies]
gilgamesh = { path = "." }
glam = "0.34.2"
image = { version = "0.25", default-features = false }

[dependencies]
cfg-if = "1"
wgpu = "30"
glam = { workspace = true }
pollster = "1"
winit = "0.30"
bytemuck = { version = "1.25", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
hexasphere = "19"
web-time = "1.1"
futures-channel = "0.3"

[dependencies.image]
workspace = true
features = ["png", "jpeg"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
