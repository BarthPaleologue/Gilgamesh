[package]
name = "gilgamesh-egui"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
gilgamesh = { workspace = true }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false }
winit = "0.30"
egui-winit = { version = "0.37", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }

[dev-dependencies]
pollster = "1"
